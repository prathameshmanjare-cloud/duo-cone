services:
  - type: web
    name: duocone-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: duocone-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: AUTO_SEED
        value: "true"
      # set these in the Render dashboard (Environment tab) to provision the
      # first CMS admin on startup; kept out of git via sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # add your Vercel URL(s) here, JSON array
      - key: CORS_ORIGINS
        value: '["https://duo-cone.vercel.app","https://duo-cone.com","https://www.duo-cone.com"]'

databases:
  - name: duocone-db
    plan: free
