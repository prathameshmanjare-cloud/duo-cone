services:
  - type: web
    name: duocone-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: duocone-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: AUTO_SEED
        value: "true"
      # set these in the Render dashboard (Environment tab) to provision the
      # first CMS admin on startup; kept out of git via sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # add your Vercel URL(s) here, JSON array
      - key: CORS_ORIGINS
        value: '["https://duo-cone.vercel.app","https://duo-cone.com","https://www.duo-cone.com"]'
      # public URL of this service — used to build absolute URLs for uploaded
      # product photos. Set to the Render service URL.
      - key: API_PUBLIC_URL
        value: https://duocone-api.onrender.com
      # storefront URL — Stripe success/cancel redirects
      - key: FRONTEND_URL
        value: https://duo-cone.vercel.app
      # Stripe — set in the Render dashboard (Environment tab), kept out of git
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Email over SMTP — set the secrets in the Render dashboard
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        value: no-reply@duo-cone.com
      - key: EMAIL_FROM_NAME
        value: DuoCone
      - key: SALES_EMAIL
        value: sales@duo-cone.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_SSL
        value: "false"

databases:
  - name: duocone-db
    plan: free
