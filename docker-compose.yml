services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: duocone
    ports:
      # localhost only — don't expose the dev database to the local network
      - "127.0.0.1:5432:5432"
    volumes:
      - duocone_db:/var/lib/postgresql/data

volumes:
  duocone_db:
